apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.rouxte.app"
    defaultConfig {
        applicationId "com.rouxte.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode auto-derives from the CI run number so every uploaded AAB
        // gets a unique, monotonically increasing code (Play rejects a reused
        // code). Internal release #1 used code 1; CI runs are now #5+, so the
        // next upload clears it. Local/dev builds fall back to 1.
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing reads from gradle properties for local builds; CI
        // overrides via android.injected.signing.* (set by fastlane).
        release {
            if (project.hasProperty('ROUXTE_RELEASE_STORE_FILE')) {
                storeFile     file(project.property('ROUXTE_RELEASE_STORE_FILE'))
                storePassword project.findProperty('ROUXTE_RELEASE_STORE_PASSWORD')
                keyAlias      project.findProperty('ROUXTE_RELEASE_KEY_ALIAS')
                keyPassword   project.findProperty('ROUXTE_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // android.injected.signing.* from CI (fastlane) takes precedence
            // over this. Locally, fails with "no signing config" if the
            // ROUXTE_RELEASE_* properties aren't set — intentional, prevents
            // an accidental debug-signed release.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
